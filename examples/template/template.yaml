apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: example-nodejs-template-existing-repo
  title: Example Node.js Template (Existing Repo)
  description: Scaffold Node.js service into an existing GitHub repository
spec:
  owner: user:guest
  type: service

  parameters:
    - title: Asset Details
      required:
        - name
      properties:
        name:
          title: Asset Name
          type: string
          description: Unique name of the component
          ui:autofocus: true

    - title: Docker Image
      required:
        - image_name
      properties:
        image_name:
          title: Docker Image Name
          type: string
          description: Docker image name of the component

    - title: Existing Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub Repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
  - id: generate
    name: Generate Node.js service files
    action: fetch:template
    input:
      url: ./content
      targetPath: .
      values:
        name: ${{ parameters.name }}
        image_name: ${{ parameters.image_name }}

  - id: create-pr
    name: Create Pull Request
    action: publish:github:pull-request
    input:
      repoUrl: ${{ parameters.repoUrl }}
      branchName: backstage-${{ parameters.name }}
      title: "Add Node.js service scaffold"
      description: "Scaffolded Node.js service and catalog-info.yaml via Backstage"

  - id: notify
    name: Notify
    action: notification:send
    input:
      recipients: entity
      entityRefs:
        - user:default/guest
      title: Template executed
      info: Pull request created successfully in the existing repository
      severity: normal

  output:
    links:
      - title: Pull Request
        url: ${{ steps['create-pr'].output.remoteUrl }}